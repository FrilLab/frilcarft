name: FrilAdd Consumer Integration

on:
  pull_request:
    paths:
      - "registry.json"
      - "apps/playground/src/catalog.tsx"
      - "packages/interactive/src/components/envelope-reveal/**"
      - "scripts/check-friladd-add.sh"
      - ".github/workflows/friladd-integration.yml"
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "apps/playground/src/catalog.tsx"
      - "packages/interactive/src/components/envelope-reveal/**"
      - "scripts/check-friladd-add.sh"
      - ".github/workflows/friladd-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-install-consumer:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout FrilCraft
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Verify published FrilAdd 0.1.1 and independent React build
        env:
          FRILADD_REGISTRY_URL: https://raw.githubusercontent.com/FrilLab/frilcraft/${{ github.event.pull_request.head.sha || github.sha }}/registry.json
        run: bash scripts/check-friladd-add.sh
