name: FrilAdd Consumer Integration

on:
  pull_request:
    paths:
      - "registry.json"
      - "packages/interactive/src/components/envelope-reveal/**"
      - "scripts/check-friladd-add.sh"
      - ".github/workflows/friladd-integration.yml"
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "packages/interactive/src/components/envelope-reveal/**"
      - "scripts/check-friladd-add.sh"
      - ".github/workflows/friladd-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-install-consumer:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout FrilCraft
        uses: actions/checkout@v4
      - name: Checkout pinned FrilAdd
        uses: actions/checkout@v4
        with:
          repository: FrilLab/friladd
          ref: 2eb1bac7752f5c3d70230e4e406a09abb6f33f2c
          path: .external/friladd
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Build Rust CLI
        run: cargo build --locked --release --manifest-path .external/friladd/Cargo.toml
      - name: Verify install, dry-run, remote manifest, and independent React build
        env:
          FRILADD_BIN: ${{ github.workspace }}/.external/friladd/target/release/friladd
          FRILADD_REGISTRY_URL: https://raw.githubusercontent.com/FrilLab/frilcarft/${{ github.event.pull_request.head.sha || github.sha }}/registry.json
        run: bash scripts/check-friladd-add.sh
